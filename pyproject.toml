[project]
name = "bili-music-segmenter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
recognizers = [
    "regex>=2026.5.9",
    "requests>=2.34.2",
    "shazamio<0.8",
]
local = [
    "inaspeechsegmenter",
    "numpy==1.26.3",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "tensorflow>=2.18,<2.19",
    { include-group = "recognizers" },
]
api = [
    { include-group = "recognizers" },
    "openai>=1.68",
    "opencc-python-reimplemented>=0.1.7",
    "oss2>=2.19",
    "python-dotenv>=1.0",
]
gpu = [
    "tensorflow[and-cuda]>=2.18,<2.19; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
inaspeechsegmenter = { git = "https://github.com/yokinanya/inaSpeechSegmenter.git" }
