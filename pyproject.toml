[project]
name = "bili-music-segmenter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shazamio>=0.9,<1",
    "google-genai>=3.3.0",
    "opencc-python-reimplemented>=0.1.7",
    "python-dotenv>=1.0",
    "yt-dlp>=2026.10.26",
    "httpx[socks]>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
default-groups = []
