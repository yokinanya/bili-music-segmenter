services:
  api:
    image: ghcr.io/yokinanya/music-segmenter:latest
    container_name: music-segmenter-api
    build: .
    env_file:
      - .env
    environment:
      WEBUI_DATA_DIR: /data/webui
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./data/webui:/data/webui
      - ./logs:/logs
