services:
  local:
    build:
      context: .
      args:
        DEPENDENCY_GROUP: local
    volumes:
      - ./input:/input:ro
      - ./output:/output
      - ./logs:/logs
    depends_on:
      netease:
        condition: service_healthy
    # Process the first media file of the fixed input directory so a new file does not need a compose edit.
    entrypoint:
      - /bin/sh
      - -c
      - exec uv run --frozen --group local inaseg.py --media "$$(ls /input/*.{mp4,mkv,flv,ts,mov,m4v,webm,mp3,m4a,aac,wav,flac,ogg} | head -n 1)" --outdir /output --netease --netease_endpoint http://netease:3000/audio/match

  netease:
    image: node:24-alpine
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    command: ["npx", "--yes", "NeteaseCloudMusicApi@latest"]
    volumes:
      - netease-npm:/root/.npm
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/audio/match').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24

volumes:
  netease-npm:
